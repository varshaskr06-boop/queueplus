# ==============================================================================
# Render Infrastructure as Code Blueprint: QueuePulse AI Complete Stack
# ==============================================================================
services:
  # 1. Express Backend Web Service
  - type: web
    name: queuepulse-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queuepulse-postgres
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: queuepulse-ml
          property: host
      - key: CORS_ORIGIN
        value: https://queuepulse.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12

  # 2. Python FastAPI Machine Learning Service
  - type: web
    name: queuepulse-ml
    env: python
    plan: free
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PATH
        value: models/queue_wait_time_rf.joblib
      - key: CORS_ORIGINS
        value: "*"

databases:
  # 3. Managed PostgreSQL Database
  - name: queuepulse-postgres
    plan: free
    region: oregon
    databaseName: queuepulse_db
    user: queuepulse_admin
